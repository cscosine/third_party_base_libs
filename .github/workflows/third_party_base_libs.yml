        output_manifest_filename = Path('third_party_base_libs-0.1.1.csOrchestratorManifest')
        project_name = 'third_party_base_libs'
        project_version = '0.1.1'
        base_path_additional_files = Path(os.environ["GITHUB_WORKSPACE"])
