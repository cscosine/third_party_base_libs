name: third_party_base_libs
'on':
  push:
    branches:
    - main
    tags:
    - v*.*.*
  workflow_dispatch: {}
  schedule:
  - cron: 15 0 * * 1
jobs:
  release-from-artifacts:
    needs: orchestrator-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Repo Self Checkout
      uses: actions/checkout@v6
    - name: Clean Artifacts Folder
      run: rm -rf artifacts
    - name: Clean Generated Files Folder
      run: rm -rf generated-for-release
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts
    - name: Show downloaded files
      run: find artifacts -type f
